[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Container's own IP isn't reachable from Zoiper, so advertise the Docker host's real
; LAN/loopback IP in SDP instead. Replace with your machine's IP (`ipconfig`/`ip addr`).
external_media_address = YOUR_HOST_IP
external_signaling_address = YOUR_HOST_IP

; Zoiper registers to this endpoint. SIP URI: 1000@<host-ip>, password below.
[1000]
type = endpoint
context = agent
disallow = all
allow = ulaw,alaw
auth = 1000-auth
aors = 1000
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[1000-auth]
type = auth
auth_type = userpass
username = 1000
password = changeme1000

[1000]
type = aor
max_contacts = 1
qualify_frequency = 30
