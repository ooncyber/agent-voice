[agent]
; Dial 600 from Zoiper to talk to the Node voice agent.
exten => 600,1,NoOp(Voice agent call)
 same => n,Answer()
 same => n,Stasis(voice-agent)
 same => n,Hangup()

; Dial 500 to sanity-check audio (hear yourself) without the Node app.
exten => 500,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; ponytail: dev-only, simulates a caller for `channel originate` smoke tests; not reachable from Zoiper.
exten => faketest,1,Answer()
 same => n,Playback(custom/test-question)
 same => n,Wait(40)
 same => n,Hangup()
